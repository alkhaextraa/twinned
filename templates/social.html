<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Options</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('imgs/BG2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 50px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 40px;
            color: #1a1a1a;
            padding-top: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .social-button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }

        .social-button:hover {
            background: #333333;
        }

        .Music {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            border-radius: 50px;
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .button-icon {
            width: 60px;
            height: 60px;
            margin-right: 8px;
            border-radius: 50%;
            object-fit: cover;
        }

        .hero-img {
            max-width: 180px;
            margin-bottom: 25px;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="imgs/PFP.jpeg" alt="Luna" class="hero-img">
        <h1>Which one?</h1>
        <div class="grid-container">
            <a href="https://www.youtube.com/" target="_blank">
                <button class="social-button">YouTube</button>
            </a>
            <a href="https://studio.youtube.com/" target="_blank">
                <button class="social-button">YouTube Studio</button>
            </a>
            <a href="https://www.instagram.com/" target="_blank">
                <button class="social-button">Instagram</button>
            </a>
            <a href="https://business.facebook.com/" target="_blank">
                <button class="social-button">Meta Business Suite</button>
            </a>
        </div>
    </div>
    <a href="https://open.spotify.com/" target="_blank">
        <button class="Music">
            <img src="imgs/music.png" alt="music icon" class="button-icon">
            Music?
        </button>
    </a>
</body>
</html>
